<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Online Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; padding-bottom: 50px; }
        header { background: #131921; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .cart-icon { background: #febd69; padding: 8px 15px; border-radius: 20px; color: #111; font-weight: bold; cursor: pointer; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .product-title { font-size: 18px; margin: 10px 0; }
        .product-price { color: #B12704; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .btn { background: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #f7ca00; }
        .cart-section { background: white; border-radius: 8px; padding: 20px; margin-top: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .total { font-size: 20px; font-weight: bold; margin-top: 15px; text-align: right; }
        .whatsapp-btn { background: #25D366; color: white; border: none; font-size: 16px; margin-top: 15px; }
        .whatsapp-btn:hover { background: #1da851; }
    </style>
</head>
<body>

    <header>
        <h1>Mera Online Store</h1>
        <div class="cart-icon" onclick="scrollToCart()">🛒 Cart (<span id="cart-count">0</span>)</div>
    </header>

    <div class="container">
        <h2>Aapke Products</h2>
        <br>
        <div class="products-grid" id="products-container"></div>

        <!-- Cart Section -->
        <div class="cart-section" id="cart">
            <h2>Your Shopping Cart</h2>
            <div id="cart-items"><p style="color:#777; margin-top:10px;">Cart khali hai.</p></div>
            <div class="total">Total: ₹<span id="cart-total">0</span></div>
            <button class="btn whatsapp-btn" onclick="sendWhatsAppOrder()">📱 WhatsApp Par Order Karein</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;
        const myPhoneNumber = "919432986924";

        const myProducts = [
    { name: "T-Shirt", price: 199, image: "t-shirt.jpg" },
    { name: "Iphone 16 pro", price: 79999, image: "iphone.jpg" },
    { name: "Zebornics headset", price: 699, image: "headset.jpg" },
    { name: "Asian running shoes", price: 1199, image: "shoes.jpg" },
    { name: "Titan watch", price: 1300, image: "watch.jpg" },
    { name: "Sunglasses", price: 199, image: "sunglasses.jpg" },
    { name: "Ring light", price: 1399, image: "ringlight.jpg" },
    { name: "Samsung M47 5g", price: 27000, image: "samsung.jpg" },
    { name: "Redmi Note 13pro 5g", price: 22000, image: "redmi.jpg" }
];
           
        function displayProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            myProducts.forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">₹${product.price}</div>
                        <button class="btn" onclick="addToCart('${product.name}', ${product.price})">Add to Cart</button>
                    </div>
                `;
            });
        }

        displayProducts();

        function addToCart(name, price) {
            cart.push({ name, price });
            total += price;
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartCountSpan = document.getElementById('cart-count');
            const cartTotalSpan = document.getElementById('cart-total');

            cartCountSpan.innerText = cart.length;
            cartTotalSpan.innerText = total;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color:#777; margin-top:10px;">Cart khali hai.</p>';
                return;
            }

            cartItemsDiv.innerHTML = '';
            cart.forEach((item, index) => {
                cartItemsDiv.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>₹${item.price}</span>
                    </div>
                `;
            });
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("Pehle Cart me product add karein!");
                return;
            }

            let message = "Namaste! Mujhe ye products order karne hain:\n\n";
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ₹${item.price}\n`;
            });
            message += `\nTotal Amount: ₹${total}\n\nKripya mera order confirm karein!`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://api.whatsapp.com/send?phone=${myPhoneNumber}&text=${encodedMessage}`, '_blank');
        }

        function scrollToCart() {
            document.getElementById('cart').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
